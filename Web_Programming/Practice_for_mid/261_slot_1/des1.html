<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="des1.css">
</head>

<body>
    <div class="full-screen">
        <div class="top">
            <div class="big-text lm20">
                CORE-TECH
            </div>
            <div class="top-mid-4">
                <div class="medium-text">
                    Overview
                </div>
                <div class="medium-text">
                    Analysis
                </div>
                <div class="medium-text">
                    Report
                </div>
                <div class="medium-text">
                    Security
                </div>
            </div>
            <div class="small-text rm20">
                Admin: ukyfhg
            </div>
        </div>
        <div class="mid p20">
            <div class="card-1 lm20 br7 p20">
                <div class="small-text">
                    Total User
                </div>
                <br>
                <div class="big-text">
                    12,450
                </div>
                <br>
                <button class="btn-1 big-text"> Up +12% Monthly </button>
            </div>

            <div class="card-2 br7 p20">
                <div class="small-text">
                    Total User
                </div>
                <br>
                <div class="big-text">
                    12,450
                </div>
                <br>
                <button class="btn-1 big-text"> Up +12% Monthly </button>
            </div>

            <div class="card-3 br7 p20">
                <div class="small-text">
                    Total User
                </div>
                <br>
                <div class="big-text">
                    12,450
                </div>
                <br>
                <button class="btn-1 big-text"> Up +12% Monthly </button>
            </div>
            <div class="card-4 rm20 br7 p20">
                <div class="small-text">
                    Total User
                </div>
                <br>
                <div class="big-text">
                    12,450
                </div>
                <br>
                <button class="btn-1 big-text"> Up +12% Monthly </button>
            </div>

        </div>
        <div class="bottom">
            <div class="b-right p20 lm20 tm20">
                <div class="big-text">
                    System Config
                </div>
                <hr>
                <div class="input-box p20 tm20">
                    <div class="form-group">
                        <div class="box-cover"> Server Name</div>
                        <input type="text" class="styled-input" placeholder="enter server alias">
                    </div>

                    <div class="form-group">
                        <div class="box-cover">Deploy Zone</div>
                        <input type="text" class="styled-input" placeholder="enter server alias">
                    </div>
                </div>
                <br>
                <div class="form-group lm20">
                        <div class="box-cover">System Description</div>
                        <input type="text" class="styled-input" placeholder="enter server alias">
                </div>
            </div>
            <div class="b-left p20 lm20 tm20">
                <div class="big-text">
                    Access Permission
                </div>
                <hr>
                <br>
                <div class="check-inputs p20">
                    <div class="box p20">
                        <input type="checkbox">
                        <div class="medium-text">Read</div>
                    </div>
                    <div class="box p20">
                        <input type="checkbox">
                        <div class="medium-text">Write</div>
                    </div>
                    <div class="box p20">
                        <input type="checkbox">
                        <div class="medium-text">Delete</div>
                    </div>
                    <div class="box p20">
                        <input type="checkbox">
                        <div class="medium-text">API</div>
                    </div>
                </div>
                <div class="last-2 tm20 lm20">
                    <button class="update-set">Update Settings</button>
                    <button class="reset-b">Reset</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
